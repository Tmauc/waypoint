<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#070714"/>

  <!-- Outer diamond (rotated square) — cyan -->
  <polygon
    points="16,3.5 28.5,16 16,28.5 3.5,16"
    fill="none"
    stroke="#00d4ff"
    stroke-width="2"
    stroke-linejoin="round"
  />

  <!-- Inner square — purple -->
  <rect
    x="10.5" y="10.5"
    width="11" height="11"
    rx="1"
    fill="none"
    stroke="#8b5cf6"
    stroke-width="1.5"
  />

  <!-- Center dot — white -->
  <circle cx="16" cy="16" r="1.5" fill="#ffffff" opacity="0.9"/>
</svg>
